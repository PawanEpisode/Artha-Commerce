version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(ci)' }
